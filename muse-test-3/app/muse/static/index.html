<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muse</title>
<style>
  :root { --bg:#fafaf9; --panel:#fff; --ink:#1c1917; --muted:#78716c; --line:#e7e5e4; --accent:#4f46e5; --warn:#b45309; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0c0a09; --panel:#1c1917; --ink:#f5f5f4; --muted:#a8a29e; --line:#292524; --accent:#818cf8; --warn:#f59e0b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  main { display:grid; grid-template-columns: 1fr 340px; gap:16px; max-width:1200px; margin:0 auto; padding:16px; height:100vh; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; height:auto; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .chat { display:flex; flex-direction:column; min-height:70vh; }
  #log { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
  .msg { padding:8px 12px; border-radius:10px; max-width:85%; white-space:pre-wrap; }
  .me { align-self:flex-end; background:var(--accent); color:#fff; }
  .muse { align-self:flex-start; border:1px solid var(--line); }
  form { display:flex; gap:8px; margin-top:10px; }
  input { flex:1; padding:10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font:inherit; min-width:0; }
  button { padding:6px 12px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; font:inherit; }
  button.primary { background:var(--accent); color:#fff; border:none; }
  aside { display:flex; flex-direction:column; gap:12px; overflow-y:auto; }
  h1 { font-size:18px; margin:0 0 8px; display:flex; justify-content:space-between; align-items:center; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:0 0 8px; }
  ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  li { display:flex; gap:8px; align-items:baseline; justify-content:space-between; font-size:14px; }
  li span { overflow-wrap:anywhere; } .pending { color:var(--warn); } .muted { color:var(--muted); font-size:13px; }
  #login { max-width:360px; margin:15vh auto; flex-direction:column; }
  #login p { margin:4px 0 0; min-height:1.5em; color:var(--warn); }
</style>
</head>
<body>
<section id="login" style="display:none">
  <h1>Muse</h1>
  <form id="signin" style="flex-direction:column">
    <input id="email" type="email" placeholder="Email" autocomplete="username" required>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="primary">Sign in</button>
  </form>
  <p id="loginError"></p>
</section>
<main id="app" style="display:none">
  <section class="chat">
    <h1>Muse <button id="signout">Sign out</button></h1>
    <div id="log"></div>
    <form id="form"><input id="input" placeholder="Ask Muse to do something…" autocomplete="off"><button class="primary">Send</button></form>
  </section>
  <aside>
    <section><h2>Approvals</h2><ul id="approvals"></ul></section>
    <section><h2>Memories</h2><ul id="memories"></ul></section>
    <section><h2>Background tasks</h2><ul id="tasks"></ul></section>
    <section><h2>Audit trail</h2><ul id="audit"></ul></section>
  </aside>
</main>
<script>
const CONFIG = /*CONFIG*/{};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const store = { get: (k) => { try { return sessionStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { v ? sessionStorage.setItem(k, v) : sessionStorage.removeItem(k); } catch {} } };
let token = store.get("muse.token");

// Cognito's InitiateAuth, called directly: no SDK, no hosted UI.
async function signIn(email, password) {
  const r = await fetch(`https://cognito-idp.${CONFIG.region}.amazonaws.com/`, {
    method: "POST",
    headers: { "Content-Type": "application/x-amz-json-1.1", "X-Amz-Target": "AWSCognitoIdentityProviderService.InitiateAuth" },
    body: JSON.stringify({ AuthFlow: "USER_PASSWORD_AUTH", ClientId: CONFIG.clientId, AuthParameters: { USERNAME: email, PASSWORD: password } }),
  });
  const body = await r.json();
  if (!r.ok) throw new Error(body.message || "sign-in failed");
  if (!body.AuthenticationResult) throw new Error(`Cognito wants ${body.ChallengeName}; set a permanent password first (see README)`);
  return body.AuthenticationResult.AccessToken;
}
function show(signedIn) { $("login").style.display = signedIn ? "none" : "flex"; $("app").style.display = signedIn ? "grid" : "none"; }
function signOut() { token = null; store.set("muse.token", null); show(false); }

const api = async (path, opts = {}) => {
  const r = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` } });
  if (r.status === 401) { signOut(); throw new Error("signed out"); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.status === 204 ? null : r.json();
};
const say = (who, text) => { const d = document.createElement("div"); d.className = `msg ${who}`; d.textContent = text; $("log").append(d); d.scrollIntoView(); return d; };
const list = (id, items, row) => { $(id).innerHTML = items.length ? items.map(row).join("") : '<li class="muted">Nothing yet</li>'; };

// A chat turn runs on the worker; poll it until it finishes.
async function awaitTurn(id, bubble) {
  for (let i = 0; ; i++) {
    const turn = await api(`/chat/${id}`);
    if (turn.status !== "running") return turn;
    bubble.textContent = "Working" + ".".repeat(1 + (i % 3));
    await sleep(1500);
  }
}

async function refresh() {
  if (!token) return;
  const [memories, tasks, approvals, audit] = await Promise.all(["/memories", "/tasks", "/approvals", "/audit"].map((p) => api(p)));
  list("memories", memories, (m) => `<li><span>${esc(m.text)} <span class="muted">${m.kind}</span></span><button onclick="del('/memories/${m.id}')">Forget</button></li>`);
  list("tasks", tasks, (t) => `<li><span>${esc(t.prompt)} <span class="muted">every ${t.every_minutes}m${t.last_result ? " · " + esc(t.last_result.slice(0, 120)) : ""}</span></span><button onclick="del('/tasks/${t.id}')">Delete</button></li>`);
  list("approvals", approvals.slice(0, 10), (a) => a.status === "pending"
    ? `<li><span class="pending">${esc(a.domain)}</span><span><button onclick="decide('${a.domain}', true)">Allow</button> <button onclick="decide('${a.domain}', false)">Deny</button></span></li>`
    : `<li><span>${esc(a.domain)}</span><span class="muted">${a.status}</span></li>`);
  list("audit", audit.slice(0, 15), (e) => `<li><span class="muted">${new Date(e.at * 1000).toLocaleTimeString()}</span><span>${esc(e.event)} ${esc(e.detail.name || e.detail.domain || "")}</span></li>`);
}
async function del(path) { await api(path, { method: "DELETE" }); refresh(); }
async function decide(domain, approve) { await api(`/approvals/${domain}`, { method: "POST", body: JSON.stringify({ approve }) }); refresh(); }

$("signin").onsubmit = async (e) => {
  e.preventDefault(); $("loginError").textContent = "";
  try { token = await signIn($("email").value, $("password").value); store.set("muse.token", token); show(true); refresh(); }
  catch (err) { $("loginError").textContent = err.message; }
};
$("signout").onclick = signOut;
$("form").onsubmit = async (e) => {
  e.preventDefault();
  const message = $("input").value.trim(); if (!message) return;
  $("input").value = ""; say("me", message);
  const bubble = say("muse", "Working…");
  try {
    const { id } = await api("/chat", { method: "POST", body: JSON.stringify({ message }) });
    const turn = await awaitTurn(id, bubble);
    bubble.textContent = turn.status === "done" ? turn.reply : `⚠️ ${turn.reply}`;
  } catch (err) { bubble.textContent = `⚠️ ${err.message}`; }
  refresh();
};
show(!!token); refresh().catch(() => {}); setInterval(() => refresh().catch(() => {}), 15000);
</script>
</body>
</html>
